modules:
  jira:issuePanel:
    - key: test-steps-panel
      resource: panel
      resolver:
        function: resolver
      render: native
      title: Passos do teste
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  jira:issueContext:
    - key: coverage-context
      resource: coverage
      resolver:
        function: resolver
      render: native
      title: Cobertura de testes
      label: Cobertura de testes
  jira:adminPage:
    - key: admin-page
      resource: admin
      resolver:
        function: resolver
      render: native
      title: Gestor de Testes
  webtrigger:
    - key: junit-import
      function: junit-import
  function:
    - key: resolver
      handler: index.handler
    - key: junit-import
      handler: webtrigger.handler

resources:
  - key: panel
    path: src/frontend/panel.jsx
  - key: admin
    path: src/frontend/admin.jsx
  - key: coverage
    path: src/frontend/coverage.jsx

permissions:
  scopes:
    - storage:app
    - read:jira-work
    - manage:jira-configuration

app:
  runtime:
    name: nodejs22.x
  # Substituído automaticamente ao rodar `forge register`.
  id: ari:cloud:ecosystem::app/00000000-0000-0000-0000-000000000000
